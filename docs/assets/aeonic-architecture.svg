<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Aeonic architecture</title>
  <desc id="diagram-description">A clean architecture diagram showing the browser, Caddy and React edge, Express API, media worker, persistent data, and optional AI services.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#25324a" flood-opacity="0.12"/></filter>
    <marker id="core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>
      .title{font:800 34px Arial,"Helvetica Neue",sans-serif;letter-spacing:-1px;fill:#172033}.subtitle{font:400 17px Arial,"Helvetica Neue",sans-serif;fill:#64748b}.heading{font:700 20px Arial,"Helvetica Neue",sans-serif;letter-spacing:-.25px;fill:#25324a}.body{font:400 16px Arial,"Helvetica Neue",sans-serif;fill:#475569}.small{font:400 14px Arial,"Helvetica Neue",sans-serif;fill:#64748b}.card{stroke:#25324a;stroke-width:3;rx:18;filter:url(#shadow)}.boundary{stroke-width:2.5;stroke-dasharray:12 10;rx:24}.core{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#core-arrow)}.ai{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ai-arrow)}.flow-label{font:700 14px Arial,"Helvetica Neue",sans-serif;fill:#334155;paint-order:stroke;stroke:#fbfaf7;stroke-width:6}.ai-label{font:700 14px Arial,"Helvetica Neue",sans-serif;fill:#6d28d9;paint-order:stroke;stroke:#fbfaf7;stroke-width:6}
    </style>
  </defs>
  <rect width="1600" height="930" fill="#fbfaf7"/>
  <text x="50" y="65" class="title">How Aeonic moves media</text>
  <text x="52" y="100" class="subtitle">A clean core path with optional intelligence kept outside the critical flow.</text>
  <path d="M1240 55H1312" class="core" marker-end="none"/><text x="1325" y="60" class="small">core</text>
  <path d="M1240 90H1312" class="ai" marker-end="none"/><text x="1325" y="95" class="small" fill="#6d28d9">optional AI</text>

