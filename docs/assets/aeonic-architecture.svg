  <text x="285" y="185" class="heading">Docker Compose host</text><text x="505" y="185" class="small">only the edge publishes ports</text>
  <rect x="1260" y="140" width="300" height="700" fill="#faf5ff" stroke="#7c3aed" class="boundary"/>
  <text x="1285" y="185" class="heading" fill="#6d28d9">Optional intelligence</text><text x="1286" y="212" class="small" fill="#7c3aed">disabled by default</text>

