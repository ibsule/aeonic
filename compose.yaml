name: aeonic

x-runtime: &runtime
  build:
    context: .
    dockerfile: Dockerfile
  image: aeonic-api:0.8.0
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3001
    TRUST_PROXY: "true"
    DATABASE_PATH: /app/data/aeonic.db
    LOCAL_STORAGE_PATH: /app/data/objects
    TUS_STORAGE_PATH: /app/data/tus
    BETTER_AUTH_URL: ${AEONIC_ORIGIN:-https://localhost}
    DELIVERY_BASE_URL: ${AEONIC_ORIGIN:-https://localhost}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    DELIVERY_SIGNING_KEYS: ${DELIVERY_SIGNING_KEYS:-}
    AI_ENABLED: ${AI_ENABLED:-false}
    AI_PROVIDER: ${AI_PROVIDER:-openai}
    AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
    AI_PROVIDER_API_KEY_FILE: /run/secrets/ai-provider-api-key.txt
    AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
    AI_PIPELINE_VERSION: ${AI_PIPELINE_VERSION:-semantic-v1}
    AI_INPUT_MICRO_USD_PER_MILLION_UNITS: ${AI_INPUT_MICRO_USD_PER_MILLION_UNITS:-0}
    AI_OUTPUT_MICRO_USD_PER_MILLION_UNITS: ${AI_OUTPUT_MICRO_USD_PER_MILLION_UNITS:-0}
    QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    QDRANT_API_KEY_FILE: /run/secrets/qdrant-api-key.txt
    AEONIC_VERSION: 0.8.0
  volumes:
    - aeonic-data:/app/data
    - ./secrets:/run/secrets:ro
  networks:
    - internal
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    image: aeonic-edge:0.8.0
    restart: unless-stopped
    environment:
      AEONIC_ORIGIN: ${AEONIC_ORIGIN:-https://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - internal
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  api:
    <<: *runtime
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    <<: *runtime
    command: ["node", "--enable-source-maps", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/aeonic.db
      LOCAL_STORAGE_PATH: /app/data/objects
      TUS_STORAGE_PATH: /app/data/tus
      BETTER_AUTH_URL: ${AEONIC_ORIGIN:-https://localhost}
      DELIVERY_BASE_URL: ${AEONIC_ORIGIN:-https://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      DELIVERY_SIGNING_KEYS: ${DELIVERY_SIGNING_KEYS:-}
      AEONIC_VERSION: 0.8.0
      WORKER_ID: worker:compose-primary
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.19.1-unprivileged
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - internal
    read_only: true
    tmpfs:
      - /qdrant/snapshots:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ai-worker:
    <<: *runtime
    profiles: ["ai"]
    command: ["node", "--enable-source-maps", "apps/api/dist/ai-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/aeonic.db
      LOCAL_STORAGE_PATH: /app/data/objects
      TUS_STORAGE_PATH: /app/data/tus
      BETTER_AUTH_URL: ${AEONIC_ORIGIN:-https://localhost}
      DELIVERY_BASE_URL: ${AEONIC_ORIGIN:-https://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      DELIVERY_SIGNING_KEYS: ${DELIVERY_SIGNING_KEYS:-}
      AI_ENABLED: "true"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_PROVIDER_API_KEY_FILE: /run/secrets/ai-provider-api-key.txt
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      AI_PIPELINE_VERSION: ${AI_PIPELINE_VERSION:-semantic-v1}
      AI_INPUT_MICRO_USD_PER_MILLION_UNITS: ${AI_INPUT_MICRO_USD_PER_MILLION_UNITS:-0}
      AI_OUTPUT_MICRO_USD_PER_MILLION_UNITS: ${AI_OUTPUT_MICRO_USD_PER_MILLION_UNITS:-0}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY_FILE: /run/secrets/qdrant-api-key.txt
      WORKER_ID: ai-worker:compose-primary
    depends_on:
      api:
        condition: service_healthy
      qdrant:
        condition: service_started

networks:
  edge:
  internal:
    internal: true

volumes:
  aeonic-data:
  caddy-data:
  caddy-config:
  qdrant-data:
