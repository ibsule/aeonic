name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and sign the images
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Validate version and tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_TAG: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "push" ] && [ "$GIT_TAG" != "v$VERSION" ]; then
            echo "Tag $GIT_TAG does not match package version v$VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ] || [ "$MANUAL_PUBLISH" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable the declared package manager
        run: |
          corepack enable
          corepack install

      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core libreoffice poppler-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  images:
    name: Build ${{ matrix.image }} image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            target: api
          - image: worker
            dockerfile: Dockerfile
            target: worker
          - image: edge
            dockerfile: Dockerfile.edge
            target: edge

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/ibsule/aeonic-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.validate.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.version, '-') }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.validate.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max

      - name: Resolve platform manifests
        if: needs.validate.outputs.publish == 'true'
        id: platforms
        env:
          IMAGE: ${{ env.REGISTRY }}/ibsule/aeonic-${{ matrix.image }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          index="$(docker buildx imagetools inspect --raw "$IMAGE@$INDEX_DIGEST")"
          amd64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$index")"
          arm64="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "$index")"
          if [ -z "$amd64" ] || [ "$amd64" = "null" ] || [ -z "$arm64" ] || [ "$arm64" = "null" ]; then
            echo "The published index does not contain both supported Linux platforms." >&2
            exit 1
          fi
          echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"

      - name: Scan linux/amd64 image
        if: needs.validate.outputs.publish == 'true'
        uses: anchore/scan-action@f6601287cdb1efc985d6b765bbf99cb4c0ac29d8 # v7.0.0
        with:
          image: ${{ env.REGISTRY }}/ibsule/aeonic-${{ matrix.image }}@${{ steps.platforms.outputs.amd64 }}
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Scan linux/arm64 image
        if: needs.validate.outputs.publish == 'true'
        uses: anchore/scan-action@f6601287cdb1efc985d6b765bbf99cb4c0ac29d8 # v7.0.0
        with:
          image: ${{ env.REGISTRY }}/ibsule/aeonic-${{ matrix.image }}@${{ steps.platforms.outputs.arm64 }}
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Install Cosign
        if: needs.validate.outputs.publish == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign image by digest
        if: needs.validate.outputs.publish == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/ibsule/aeonic-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
